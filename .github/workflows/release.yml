name: Release native images

on:
  release:
    types: [created]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'

      - name: Install native-image
        run: |
          gu --version || true
          gu install native-image

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build package and native images
        run: mvn -Pnative -DskipTests package -B

      - name: Verify native binaries
        run: |
          ./target/oracle-app --version || true
          ./target/serialization-app . | grep "JSON output written to" || true

      - name: Upload oracle-app to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/oracle-app
          asset_name: oracle-app
          asset_content_type: application/octet-stream

      - name: Upload serialization-app to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/serialization-app
          asset_name: serialization-app
          asset_content_type: application/octet-stream
